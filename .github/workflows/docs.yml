# Save as .github/workflows/docs.yml
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # nbsphinx needs pandoc, which pip can't install
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # corner and beautifulsoup4 are imported but not declared in pyproject.toml
      - name: Install backpop + docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]" corner beautifulsoup4

      - name: Build docs
        working-directory: docs
        run: make html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
