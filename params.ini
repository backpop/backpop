; BackPop INI file

; Main backpop settings
[backpop]

; n_threads
; Sets the number of cores to use in multiprocessing
; Used for parallelization of the sampler calculations. Must use a positive integer. If None, no parallelization used.
; Options: 
;    integer values - Number of cores
;    2 - For example, this sets the number of cores to 2
;     - Default value (not using multiprocessing)
; Default: ""
n_threads = ""

; n_eff
; Minimum effective sample size (see nautilus docs)
; This determines a minimum sample size that needs to be reached for the sampler to converge. However, this does not mean convergence occurs at ``n_eff``.
; Options: 
;    8000 - For example, this sets the minimum effective sample size to be 8000
; Default: 8000
n_eff = 8000

; n_live
; Number of live points (see '>nautilus docs)
; Boundaries are constructed to encompass these live points.
; Options: 
;    1000 - For example, this sets the number of live points to be 1000
; Default: 1000
n_live = 1000

; verbose
; Whether to print verbose output from BackPop and sampler.
; 
; Options: 
;    True - Print verbose output from BackPop and sampler progress.
;    False - Do not print verbose output from Backpop and sampler progress.
; Default: False
verbose = False

; output_folder
; Path to save output files. If not supplied, output folder created in directory BackPop is run.
; 
; Options: 
;    path/to/output_folder - This specifies the absolute path to save the output files from BackPop.
;     - Default value (not supplying an output path)
; Default: ""
output_folder = ""

; resume
; Resumes sampling from previous run (see '>nautilus docs)
; 
; Options: 
;    True - Resume sampler from previous run.
;    False - Do not resume sampler from previous run. Restart sampler and rewrite files.
; Default: False
resume = False

; phase_condition
; Determines evolutionary state(s) of interest
; Can use predefined phases or custom phase to target astrophysical events. See COSMIC output docs for information on evolutionary conventions.
; Options: 
;    BH_MS - For example, this phase selects binaries with a kstar_1 = 14 & kstar_2 = [0,1] or kstar_1 = [0,1] & kstar_2 = 14.
;     - Default does not filter for any condition.
; Default: ""
phase_condition = ""

; use_bcm
; Saves BCM from Backpop run (see '>COSMIC BCM docs)
; 
; Options: 
;    True - Saves BCM from BackPop run.
;    False - Does not save BCM from backpop run.
; Default: False
use_bcm = False

; bcm_columns
; Select which columns in the BCM to save
; Must choose columns that are in COSMIC BCM docs.
; Options: 
;    ['tphys', 'kstar_1', 'kstar_2', 'ecc'] - For example, this phase selects binaries with a kstar_1 = 14 & kstar_2 = [0,1] or kstar_1 = [0,1] & kstar_2 = 14.
;     - Default to save all BCM columns if ``use_bcm`` is True.
; Default: ""
bcm_columns = ""

; bpp_columns
; Select which columns in the BPP to save
; Must choose columns that match the observational constraints given. See COSMIC BPP docs for column names.
; Options: 
;    ['mass_1', 'mass_2', 'porb', 'ecc'] - For example, this phase selects binaries with a kstar_1 = 14 & kstar_2 = [0,1] or kstar_1 = [0,1] & kstar_2 = 14.
;     - Default to save all BPP columns.
; Default: ""
bpp_columns = ""

; n_bpp_rows
; Batch size used to label bin_num
; Should choose a batch size that is large enough to encompass one entire binary evolution.
; Options: 
;    25 - For example, this sets the batch size to be 35 lines of the output
;    35 - Default value is 35 rows
; Default: 35
n_bpp_rows = 35

; Observational constraints

[backpop.obs::m1]

; mean
; Observed mass of the primary in solar masses
; 
; Options: 
;    10 - For example, this sets the mass to 10 Msun
;     - Default value
; Default: ""
mean = ""

; sigma
; Uncertainity of the observed mass of the primary in solar masses
; 
; Options: 
;    2 - For example, this sets the sigma to 2 Msun
;     - Default value
; Default: ""
sigma = ""

; out_name
; Column name used to store the primary mass observable in the output files
; Must match a column name in the BPP/BCM output (see COSMIC docs).
; Options: 
;    mass_1 - For example, this compares the observable against the mass_1 column
; Default: mass_1
out_name = mass_1

[backpop.obs::m2]

; mean
; Observed mass of the secondary in solar masses
; 
; Options: 
;    10 - For example, this sets the mass to 10 Msun
;     - Default value
; Default: ""
mean = ""

; sigma
; Uncertainity of the observed mass of the secondary in solar masses
; 
; Options: 
;    2 - For example, this sets the sigma to 2 Msun
;     - Default value
; Default: ""
sigma = ""

; out_name
; Column name used to store the secondary mass observable in the output files
; Must match a column name in the BPP/BCM output (see COSMIC docs).
; Options: 
;    mass_2 - For example, this compares the observable against the mass_2 column
; Default: mass_2
out_name = mass_2

[backpop.obs::tb]

; mean
; Observed orbital period in days
; 
; Options: 
;    10 - For example, this sets the orbital period to 10 days
;     - Default value
; Default: ""
mean = ""

; sigma
; Uncertainty of the observed orbital period in days
; 
; Options: 
;    2 - For example, this sets the sigma to 2 days
;     - Default value
; Default: ""
sigma = ""

; out_name
; Column name used to store the orbital period observable in the output files
; Must match a column name in the BPP/BCM output (see COSMIC docs).
; Options: 
;    porb - For example, this compares the observable against the porb column
; Default: porb
out_name = porb

[backpop.obs::e]

; mean
; Observed eccentricity
; 
; Options: 
;    0.5 - For example, this sets the eccentricity to 0.5
;     - Default value
; Default: ""
mean = ""

; sigma
; Uncertainity of the observed eccentricity
; 
; Options: 
;    0.01 - For example, this sets the sigma to 0.01
;     - Default value
; Default: ""
sigma = ""

; out_name
; Column name used to store the eccentricity observable in the output files
; Must match a column name in the BPP/BCM output (see COSMIC docs).
; Options: 
;    ecc - For example, this compares the observable against the ecc column
; Default: ecc
out_name = ecc

[backpop.fixed::metallicity]

; value
; Observed (or assumed) metallicity of the binary, in absolute units (Z). Only used when metallicity is fixed. When using METISSE, the metallicity value must match those of the stellar tracks.
; 
; Options: 
;    0.02 - For example, this sets the metallicity to solar (Z = 0.02)
;    0.01 - Default value
; Default: 0.01
value = 0.01

[backpop.fixed::tphys]

; value
; Observed (or assumed) evolutionary time of the binary in Myr
; 
; Options: 
;    10000 - For example, this sets the evolution time to 10000 Myr
;     - Default value
; Default: ""
value = ""

; Prior info on parameters to vary

[backpop.var::m1]

; min
; Minimum allowed value of the primary mass prior, in solar masses
; 
; Options: 
;    5 - For example, this sets the minimum primary mass to 5 Msun
;     - Default value
; Default: ""
min = ""

; max
; Maximum allowed value of the primary mass prior, in solar masses
; 
; Options: 
;    150 - For example, this sets the maximum primary mass to 150 Msun
;     - Default value
; Default: ""
max = ""

[backpop.var::m2]

; min
; Minimum allowed value of the secondary mass prior, in solar masses
; 
; Options: 
;    0.1 - For example, this sets the minimum secondary mass to 0.1 Msun
;     - Default value
; Default: ""
min = ""

; max
; Maximum allowed value of the secondary mass prior, in solar masses
; 
; Options: 
;    150 - For example, this sets the maximum secondary mass to 150 Msun
;     - Default value
; Default: ""
max = ""

[backpop.var::tb]

; min
; Minimum allowed value of the orbital period prior, in days
; 
; Options: 
;    0.1 - For example, this sets the minimum orbital period to 0.1 days
;     - Default value
; Default: ""
min = ""

; max
; Maximum allowed value of the orbital period prior, in days
; 
; Options: 
;    10000 - For example, this sets the maximum orbital period to 10000 days
;     - Default value
; Default: ""
max = ""

[backpop.var::e]

; min
; Minimum allowed value of the eccentricity prior
; 
; Options: 
;    0 - For example, this sets the minimum eccentricity to 0 (circular)
;     - Default value
; Default: ""
min = ""

; max
; Maximum allowed value of the eccentricity prior
; 
; Options: 
;    1 - For example, this sets the maximum eccentricity to 1
;     - Default value
; Default: ""
max = ""

[sse]

; stellar_engine
; Select which stellar evolution engine to use for single star evolution
; 
; Options: 
;    sse - Use SSE for single star evolution which will apply the fitting formulae from Hurley+2000 for the single star evolution
;    metisse - Use METISSE for single star evolution, must supply ``path_to_tracks`` and ``path_to_he_tracks``
; Default: sse
stellar_engine = sse

; path_to_tracks
; Path to the METISSE tracks for single star evolution. Must be supplied if ``stellar_engine`` is set to ``metisse``
; 
; Options: 
;    path/to/tracks - This specifies the absolute path to the EEP tracks for single star evolution. Leave the string empty if not using METISSE for single star evolution.
;     - Default value (not using METISSE for single star evolution)
; Default: ""
path_to_tracks = ""

; path_to_he_tracks
; Path to the METISSE tracks for helium star evolution. Must be supplied if ``stellar_engine`` is set to ``metisse``
; 
; Options: 
;    path/to/he_tracks - This specifies the absolute path to the EEP tracks for helium star evolution. Leave the string empty if not using METISSE for single star evolution.
;     - Default value (not using METISSE for single star evolution)
; Default: ""
path_to_he_tracks = ""

; z_accuracy_limit
; Sets the maximum allowed relative difference between the supplied metallicity and the tracks used by METISSE. If cosmic throws an error due to metallicity, increasing this slightly may help. Must be supplied if ``stellar_engine`` is set to ``metisse``
; 
; Options: 
;    positive values - Minimum metallicity
;    0.01 - Recommended value
; Default: 0.01
z_accuracy_limit = 0.01

; metisse_verbose
; Whether to print verbose output from METISSE when using METISSE for single star evolution.
; 
; Options: 
;    True - Print verbose output from METISSE when using METISSE for single star evolution.
;    False - Do not print verbose output from METISSE when using METISSE for single star evolution.
; Default: False
metisse_verbose = False
