{%- extends "!sidebar/brand.html" %}
{%- block brand_content %}
<div class="sidebar-logo-container">
  <img
    class="sidebar-logo gif-logo"
    src="{{ pathto('_static/img/tina_static.png', 1) }}"
    data-static="{{ pathto('_static/img/tina_static.png', 1) }}"
    data-gif="{{ pathto('_static/img/tina_dynamic.gif', 1) }}"
    alt="Logo"
  />
</div>
{% if not theme_sidebar_hide_name %}
<span class="sidebar-brand-text">{{ docstitle if docstitle else project }}</span>
{%- endif %}
{% endblock brand_content %}
